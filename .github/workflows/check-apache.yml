name: Check Apache

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
      - run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i /tmp/ssh_key ubuntu@141.147.169.200 '
          echo "=== APACHE STATUS ==="
          sudo systemctl status apache2 --no-pager
          echo "=== LISTENING PORTS ==="
          sudo ss -tlnp
          echo "=== LOCAL CURL ==="
          curl -sv localhost 2>&1 | head -20
          '
