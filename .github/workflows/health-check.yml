name: Health Check & Auto Restart
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-lambs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - name: Check Lambs API
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 https://wool.cc.cd/lambs/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Lambs OK"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Lambs DOWN after 3 attempts"

      - name: Restart Web1 (Wool)
        if: failure()
        run: |
          curl -sSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_key.pem
          chmod 600 ~/.oci/oci_key.pem
          cat > ~/.oci/config << 'CFG'
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_key.pem
          CFG
          $HOME/bin/oci compute instance action --instance-id "${{ secrets.OCI_WEB1_OCID }}" --action SOFTRESET --wait-for-state RUNNING
          echo "Web1 restarted"

      - name: Verify Recovery
        if: failure()
        run: |
          sleep 90
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 https://wool.cc.cd/lambs/api/health)
          echo "After restart: HTTP $STATUS"

  check-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check QA API
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 https://wool.cc.cd/QA_Test/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "QA OK"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "QA DOWN after 3 attempts"
