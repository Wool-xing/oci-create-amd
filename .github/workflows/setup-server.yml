name: Setup Server

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --prefer-dist --no-progress
      - run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
      - name: Restore security rules (SSH+HTTP+HTTPS)
        run: php fix-rules.php
      - name: Install Apache
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i /tmp/ssh_key ubuntu@141.147.169.200 '
            sudo apt update -y && sudo apt install apache2 -y && sudo systemctl enable apache2 && sudo systemctl start apache2
          '
      - name: Verify
        run: curl -s -o /dev/null -w "%{http_code}" http://141.147.169.200
