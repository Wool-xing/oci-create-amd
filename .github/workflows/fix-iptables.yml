name: Fix Iptables

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
      - run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@141.147.169.200 '
          echo "=== IPTABLES ==="
          sudo iptables -L INPUT -n -v 2>&1
          echo "=== APACHE LISTEN ==="
          sudo netstat -tlnp 2>/dev/null || sudo ss -tlnp
          echo "=== FIX iptables ==="
          sudo iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
          sudo iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
          echo "=== VERIFY ==="
          sudo iptables -L INPUT -n | grep -E "80|443"
          '
