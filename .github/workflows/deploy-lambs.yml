name: Deploy Lambs Frontend
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build
        run: |
          cd web
          npm ci
          npm run build

      - name: Deploy to Wool
        run: |
          cd web/dist
          tar czf /tmp/lambs-web.tar.gz .
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          scp -o StrictHostKeyChecking=no -i /tmp/ssh_key /tmp/lambs-web.tar.gz ubuntu@${{ secrets.WOOL_PUBLIC_IP }}:~/
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@${{ secrets.WOOL_PUBLIC_IP }} \
            "sudo tar xzf ~/lambs-web.tar.gz -C /var/www/lambs && sudo chown -R www-data:www-data /var/www/lambs && rm ~/lambs-web.tar.gz"

      - name: Verify
        run: |
          curl -sf -o /dev/null -w '%{http_code}' https://wool.cc.cd/lambs/
