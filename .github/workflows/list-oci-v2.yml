name: List OCI Instances V2
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install OCI CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_key.pem
          chmod 600 ~/.oci/oci_key.pem
          cat > ~/.oci/config << 'CFG'
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_key.pem
          CFG
      - name: List Instances
        run: |
          $HOME/bin/oci compute instance list --compartment-id "${{ secrets.OCI_TENANCY_ID }}" --all --output json > /tmp/instances.json 2>&1 || true
          python3 -c "
import json
try:
    d = json.load(open('/tmp/instances.json'))
    if isinstance(d, list):
        for i in d:
            print('INST|' + str(i.get('display-name','')) + '|' + str(i.get('id','')) + '|' + str(i.get('shape','')) + '|' + str(i.get('lifecycle-state','')) + '|' + str(i.get('availability-domain','')))
    else:
        print('RAW:' + open('/tmp/instances.json').read()[:500])
except Exception as e:
    print('ERR:' + str(e))
    print(open('/tmp/instances.json').read()[:500])
"
          echo "=== INSTANCES_DONE ==="
