name: Create AMD Ubuntu

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --prefer-dist --no-progress
      - run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - name: Kill old
        continue-on-error: true
        env:
          OCI_REGION: ap-tokyo-1
          OCI_USER_ID: ocid1.user.oc1..aaaaaaaarcfcfjovuaim6ga55repfnjzonscc2p6265awjw454mc5wf7shhq
          OCI_TENANCY_ID: ocid1.tenancy.oc1..aaaaaaaaw32ngyf5nyfxt4ju7ag53mss3hpj7jdt5gbhezlrqwqvnqh2ywha
          OCI_KEY_FINGERPRINT: 3e:47:65:7c:46:06:46:86:bc:83:de:bd:39:1e:be:04
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_key.pem
          OCI_SUBNET_ID: ocid1.subnet.oc1.ap-tokyo-1.aaaaaaaaja6c5ybdagcrrcgacrvbtbbo2owvp74b2sfzljj6gglxuok5dcjq
          OCI_IMAGE_ID: ocid1.image.oc1.ap-tokyo-1.aaaaaaaa5xvmxb5y7np7tunegntczkjzb376ou63xif5flq3zo44r7lo3oaq
        run: php kill.php
      - run: sleep 15
      - name: Create
        env:
          OCI_REGION: ap-tokyo-1
          OCI_USER_ID: ocid1.user.oc1..aaaaaaaarcfcfjovuaim6ga55repfnjzonscc2p6265awjw454mc5wf7shhq
          OCI_TENANCY_ID: ocid1.tenancy.oc1..aaaaaaaaw32ngyf5nyfxt4ju7ag53mss3hpj7jdt5gbhezlrqwqvnqh2ywha
          OCI_KEY_FINGERPRINT: 3e:47:65:7c:46:06:46:86:bc:83:de:bd:39:1e:be:04
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_key.pem
          OCI_SUBNET_ID: ocid1.subnet.oc1.ap-tokyo-1.aaaaaaaaja6c5ybdagcrrcgacrvbtbbo2owvp74b2sfzljj6gglxuok5dcjq
          OCI_IMAGE_ID: ocid1.image.oc1.ap-tokyo-1.aaaaaaaa5xvmxb5y7np7tunegntczkjzb376ou63xif5flq3zo44r7lo3oaq
          OCI_OCPUS: 1
          OCI_MEMORY_IN_GBS: 1
          OCI_SHAPE: VM.Standard.E2.1.Micro
          OCI_MAX_INSTANCES: 3
          OCI_SSH_PUBLIC_KEY: ssh-rsa  admin@LAPTOP-QEJT7THQ
          CACHE_AVAILABILITY_DOMAINS: 1
          TOO_MANY_REQUESTS_TIME_WAIT: 60
        run: php index.php
