name: Create AMD Ubuntu

on:
  push:
  workflow_dispatch:
    inputs:
      dummy:
        description: 'Click Run'
        required: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --prefer-dist --no-progress
      - run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - id: c
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ocid1.image.oc1.ap-tokyo-1.aaaaaaaa5xvmxb5y7np7tunegntczkjzb376ou63xif5flq3zo44r7lo3oaq
          OCI_OCPUS: 1
          OCI_MEMORY_IN_GBS: 1
          OCI_SHAPE: VM.Standard.E2.1.Micro
          OCI_MAX_INSTANCES: 3
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          CACHE_AVAILABILITY_DOMAINS: 1
          TOO_MANY_REQUESTS_TIME_WAIT: 60
        run: |
          O=$(php index.php 2>&1)
          echo "$O"
          echo "OUT<<X" >> $GITHUB_OUTPUT
          echo "$O" >> $GITHUB_OUTPUT
          echo "X" >> $GITHUB_OUTPUT
      - name: Notify
        env:
          T: ${{ secrets.PUSHPLUS_TOKEN }}
          O: ${{ steps.c.outputs.OUT }}
        run: curl -s -X POST http://www.pushplus.plus/send -H "Content-Type: application/json" -d "{\"token\":\"${T}\",\"title\":\"AMD Ubuntu Ready\",\"content\":\"<pre>${O}</pre>\",\"template\":\"html\"}"
