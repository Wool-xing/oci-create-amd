name: List Instances
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --prefer-dist --no-progress
      - run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - env:
          OCI_REGION: ap-tokyo-1
          OCI_USER_ID: ocid1.user.oc1..aaaaaaaarcfcfjovuaim6ga55repfnjzonscc2p6265awjw454mc5wf7shhq
          OCI_TENANCY_ID: ocid1.tenancy.oc1..aaaaaaaaw32ngyf5nyfxt4ju7ag53mss3hpj7jdt5gbhezlrqwqvnqh2ywha
          OCI_KEY_FINGERPRINT: 3e:47:65:7c:46:06:46:86:bc:83:de:bd:39:1e:be:04
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_key.pem
          OCI_SUBNET_ID: none
          OCI_IMAGE_ID: none
        run: |
          php -r '
          require_once "vendor/autoload.php";
          $c = new \Hitrov\OciConfig("ap-tokyo-1",getenv("OCI_USER_ID"),getenv("OCI_TENANCY_ID"),getenv("OCI_KEY_FINGERPRINT"),"/tmp/oci_key.pem","","","",1,1);
          $a = new \Hitrov\OciApi();
          $base = "https://iaas.ap-tokyo-1.oraclecloud.com/20160918/instances";
          $params = ["compartmentId"=>getenv("OCI_TENANCY_ID"),"lifecycleState"=>"RUNNING"];
          try {
            $data = $a->call($c,$base,"GET",null,$params);
            foreach($data as $i) {
              $name = $i["display-name"] ?? "?";
              $state = $i["lifecycle-state"] ?? "?";
              $shape = $i["shape"] ?? "?";
              echo "$name | $state | $shape\n";
            }
          } catch(\Exception $e) { echo "Err: ".$e->getMessage()."\n"; }
          '
